# ═══════════════════════════════════════════════════════════════════════════
# Strix Pro - Docker Compose (Development)
# ═══════════════════════════════════════════════════════════════════════════

services:
  # ── Backend API ──────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: strix-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - STRIX_ENV=development
    volumes:
      - strix-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - strix-net

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: strix-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - strix-net

  # ── Grafana Loki (Log Aggregation) ──────────────────────────────────────
  loki:
    image: grafana/loki:3.0.0
    container_name: strix-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - strix-net

  # ── Promtail (Log Collector → Loki) ────────────────────────────────────
  promtail:
    image: grafana/promtail:3.0.0
    container_name: strix-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - strix-net

  # ── Log Retention Cleanup (runs daily) ──────────────────────────────────
  log-cleanup:
    image: curlimages/curl:latest
    container_name: strix-log-cleanup
    restart: unless-stopped
    entrypoint: /bin/sh
    command:
      - -c
      - |
        echo "0 3 * * * curl -s -X POST http://backend:8000/api/logs/cleanup?days=90 -H 'Authorization: Bearer \$$(cat /tmp/token 2>/dev/null || echo '')" | crontab -
        crond -f -l 8
    depends_on:
      - backend
    networks:
      - strix-net

volumes:
  strix-data:
    driver: local
  loki-data:
    driver: local

networks:
  strix-net:
    driver: bridge
